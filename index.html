<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interpret AI — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Cedarville+Cursive&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6db; --surface:#fffdf9; --paper:#f3e9d2; --ink:#2a2420; --muted:#6d625a; --line:#e2d9cb;
  --accent:#1f5f5b; --accent-ink:#fff; --accent-soft:#e2efed;
  --low:#b4462f; --low-soft:#fbe6df; --med:#9a6a00; --med-soft:#fbf0d2;
  --ok:#2f7a4a; --ok-soft:#e1f1e6;
  --serif:'Lora',Georgia,serif; --sans:'Source Sans 3',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
button{font:inherit;color:inherit;cursor:pointer}
.phone{width:390px;height:844px;max-height:calc(100vh - 48px);background:var(--surface);border-radius:44px;box-shadow:0 0 0 10px #1d1a18,0 30px 60px rgba(0,0,0,.25);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:500px){body{padding:0}.phone{width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600}
.screen{flex:1;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;min-height:0}
h1,h2,h3{font-family:var(--serif);margin:0}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{background:#b9c9c7;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
:focus-visible{outline:3px solid #3a8fd8;outline-offset:2px}
.icon{width:20px;height:20px;flex:none}

/* home */
.home{padding:8px 24px 24px}
.brand{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:22px}
.home h1{font-size:28px}
.tag{color:var(--muted);margin:4px 0 20px;line-height:1.4}
.lang-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;margin-bottom:20px;border:0}
.capture{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.capture button{background:var(--surface);border:1.5px dashed #cdbfa9;border-radius:18px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.capture button .icon{width:28px;height:28px;color:var(--accent)}
.sec-label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.sample{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.thumb{width:64px;height:80px;border-radius:8px;background:var(--paper);flex:none;overflow:hidden;position:relative;box-shadow:inset 0 0 12px rgba(120,90,40,.25)}
.thumb span{position:absolute;left:6px;right:6px;height:2px;background:#6b5a46;opacity:.45;border-radius:2px}
.sample b{display:block;font-size:16px;margin-bottom:2px}
.sample small{color:var(--muted);font-size:13.5px;line-height:1.35;display:block}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--med-soft);color:var(--med);margin-top:6px}

/* processing */
.proc{padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
.scanbox{width:220px;height:280px;border-radius:12px;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(80,60,30,.2);margin-bottom:28px;padding:18px 14px;font-size:15px;line-height:1.7;color:#3b2f25}
.scanbox .scanline{position:absolute;left:0;right:0;height:46px;background:linear-gradient(to bottom,transparent,rgba(31,95,91,.28),transparent);animation:scan 1.6s ease-in-out infinite alternate;top:0}
@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(260px)}}
@media (prefers-reduced-motion:reduce){.scanbox .scanline{animation:none;top:40%}}
.steps{list-style:none;padding:0;margin:0;width:100%;max-width:300px}
.steps li{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--muted);font-size:15.5px}
.steps li .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.steps li.doing{color:var(--ink);font-weight:600}
.steps li.doing .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.proc h2{font-size:21px;margin-bottom:14px;text-align:center}

/* review */
.topbar{display:flex;align-items:center;gap:10px;padding:4px 14px 10px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center}
.iconbtn:hover{background:var(--accent-soft)}
.topbar .t{flex:1;min-width:0}
.topbar .t b{font-family:var(--serif);font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t small{color:var(--muted);font-size:13px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

.docwrap{margin:0 14px;border-radius:14px;background:#d9cdb6;padding:10px;position:relative;flex:none}
.doc{height:200px;overflow:auto;border-radius:6px;background:var(--paper);background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.5),transparent 60%),radial-gradient(ellipse at 90% 90%,rgba(140,100,40,.18),transparent 55%);padding:16px 18px;color:#3a2c1f;transition:height .3s}
.docwrap.big .doc{height:420px}
.doc .hl{line-height:1.55;white-space:nowrap}
.doc.f-letter{font-family:'Cedarville Cursive',cursive;font-size:22px}
.doc.f-record{font-family:'Pinyon Script',cursive;font-size:25px}
.doc .hl:nth-child(odd){transform:rotate(-.6deg)}
.doc .hl:nth-child(3n){transform:rotate(.5deg) translateX(4px)}
.dw{border-radius:4px;padding:0 2px;cursor:pointer;transition:background .2s,box-shadow .2s}
.dw.unc{box-shadow:0 0 0 2px var(--low)}
.dw.unc.med{box-shadow:0 0 0 2px dashed var(--med);outline:2px dashed var(--med);outline-offset:0;box-shadow:none}
.dw.unc.done{box-shadow:0 0 0 2px rgba(47,122,74,.55);outline:none}
.dw.flash{background:rgba(58,143,216,.3);box-shadow:0 0 0 3px #3a8fd8!important;outline:none}
.docbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:#4d4033}
.docbar button{border:0;background:rgba(255,255,255,.55);border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}

.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 18px 4px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-bottom:3px solid}
.sw.low{border-bottom:3px wavy var(--low);height:6px;border-bottom-style:wavy}
.sw.med{border-color:var(--med);border-bottom-style:dotted}
.sw.ok{border-color:var(--ok)}

.tabs{display:flex;margin:10px 14px 0;background:#efe8dc;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.trnote{margin:10px 18px 0;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.35}

.tx{padding:12px 18px 24px;font-size:17px;line-height:2}
.tx p{margin:0}
.w{border:0;background:transparent;padding:0 1px;margin:0;border-radius:4px;font-size:inherit;line-height:inherit}
.w:hover{background:#f1ece3}
.w.unc{font-weight:600;padding:0 3px}
.w.low{background:var(--low-soft);color:#7d2817;text-decoration:underline wavy var(--low);text-underline-offset:5px;text-decoration-thickness:1.5px}
.w.med{background:var(--med-soft);color:#6a4900;text-decoration:underline dotted var(--med);text-underline-offset:5px;text-decoration-thickness:2.5px}
.w.done{background:var(--ok-soft);color:#1f5a35;text-decoration:underline solid var(--ok);text-underline-offset:5px;text-decoration-thickness:1.5px}
.w.done::after{content:"✓";font-size:12px;margin-left:2px;vertical-align:super}
.w.edited{text-decoration:underline solid #8a7d70;text-underline-offset:5px}
.w.active{box-shadow:0 0 0 2px #3a8fd8}

.bottombar{flex:none;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px}
.bottombar .btn{padding:13px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(30,22,15,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;z-index:11;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:86%;display:flex;flex-direction:column}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:40px;height:5px;border-radius:5px;background:#d6cdbf;margin:8px auto 2px}
.sh-head{display:flex;align-items:center;padding:6px 10px 6px 20px}
.sh-head h3{flex:1;font-size:18px}
.sh-head small{display:block;font-family:var(--sans);font-weight:500;color:var(--muted);font-size:13px;margin-top:1px}
.sh-body{overflow-y:auto;padding:4px 20px 12px}
.zoom{background:var(--paper);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:inset 0 0 18px rgba(120,90,40,.2);text-align:center;white-space:nowrap;overflow:hidden;color:#3a2c1f}
.zoom .ctx{opacity:.4}
.zoom .z{padding:0 6px;border-radius:6px;box-shadow:0 0 0 2px #3a8fd8;background:rgba(58,143,216,.12)}
.zoom.f-letter{font-family:'Cedarville Cursive',cursive;font-size:30px}
.zoom.f-record{font-family:'Pinyon Script',cursive;font-size:32px}
.zcap{font-size:12px;color:var(--muted);margin:-4px 0 10px;text-align:center}
.why{display:flex;gap:8px;background:#f5f1ea;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4;margin-bottom:14px}
.why .icon{color:var(--med);margin-top:1px}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;position:relative}
.opt[aria-checked=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.opt .row{display:flex;align-items:center;gap:10px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #b9ad9d;flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .radio{border-color:var(--accent)}
.opt[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt .word{font-size:19px;font-weight:600;flex:1}
.opt .badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eee6d9;color:var(--muted)}
.opt .badge.best{background:var(--accent);color:#fff}
.conf{display:flex;align-items:center;gap:8px;margin:8px 0 0 30px;font-size:13px;color:var(--muted)}
.conf .bar{flex:1;height:6px;border-radius:6px;background:#eee6d9;overflow:hidden;max-width:140px}
.conf .bar i{display:block;height:100%;background:#8f8273}
.opt .tr{margin:8px 0 0 30px;padding-top:8px;border-top:1px dashed var(--line);font-size:14.5px;line-height:1.4}
.opt .tr .lbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.opt .tr b{background:#fff3b8;border-radius:3px;padding:0 2px}
.opt.own .word{font-weight:500;color:var(--muted);font-size:16px}
.own-in{margin:10px 0 0 30px;display:none}
.opt.own[aria-checked=true] .own-in{display:block}
.own-in input,.edit-in{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.own-in input:focus,.edit-in:focus{border-color:var(--accent);outline:none}
.sh-foot{display:flex;gap:10px;padding:10px 20px 20px;border-top:1px solid var(--line)}
.sh-foot .btn{padding:13px}
.sh-foot .btn.ghost{flex:0 0 38%}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2a2420;color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* picker */
.pick p{color:var(--muted);font-size:15px;line-height:1.4;margin:0 0 14px}

/* finish */
.fin{padding:12px 20px 24px}
.fin .ok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:8px auto 12px}
.fin h2{text-align:center;font-size:24px}
.fin .sub{text-align:center;color:var(--muted);margin:6px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stats div{background:#f5f1ea;border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:22px;font-family:var(--serif)}
.stats small{font-size:12px;color:var(--muted);line-height:1.2;display:block}
.card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card .hd b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .hd button{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;border-radius:9px;padding:6px 12px}
.card p{margin:0 0 6px;line-height:1.55;font-size:15.5px;white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status" aria-hidden="true"><span>9:41</span><span>●●● ▮</span></div>

  <!-- HOME -->
  <section class="screen on" id="s-home" aria-label="Home">
    <div class="scroll"><div class="home">
      <div class="brand"><div class="logo" aria-hidden="true">i</div><h1>Interpret</h1></div>
      <p class="tag">Snap a handwritten or printed page. I'll transcribe it, show you where I'm unsure, and you make the final call.</p>
      <button class="lang-chip" id="langchip" aria-label="Your language: English">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
        I read: English
      </button>
      <div class="capture">
        <button data-pick><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take a photo</button>
        <button data-pick><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></svg>Upload image</button>
      </div>
      <p class="sec-label">Sample documents</p>
      <button class="sample" data-doc="letter">
        <div class="thumb" aria-hidden="true"><span style="top:12px;right:20px"></span><span style="top:22px"></span><span style="top:32px"></span><span style="top:42px;right:14px"></span><span style="top:52px"></span><span style="top:62px;right:26px"></span></div>
        <div><b>Letter to Margaret</b><small>English cursive · 1958 · family letter</small><span class="pill">Messy handwriting</span></div>
      </button>
      <button class="sample" data-doc="record">
        <div class="thumb" aria-hidden="true" style="background:#ecdfc2"><span style="top:12px"></span><span style="top:22px;right:18px"></span><span style="top:32px"></span><span style="top:42px"></span><span style="top:52px;right:30px"></span><span style="top:62px"></span></div>
        <div><b>Baptism record, Kirchberg</b><small>German · 1891 · family history</small><span class="pill">Different language</span></div>
      </button>
    </div></div>
  </section>

  <!-- PROCESSING -->
  <section class="screen" id="s-proc" aria-label="Transcribing">
    <div class="proc">
      <div class="scanbox" id="scanbox" aria-hidden="true"><div class="scanline"></div></div>
      <h2 id="proc-title" aria-live="polite">Reading your document…</h2>
      <ul class="steps" id="steps"></ul>
    </div>
  </section>

  <!-- REVIEW -->
  <section class="screen" id="s-review" aria-label="Review transcription">
    <div class="topbar">
      <button class="iconbtn" id="back" aria-label="Back to home"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="t"><b id="rv-title"></b><small id="rv-prog" aria-live="polite"></small><div class="progress"><i id="rv-bar"></i></div></div>
    </div>
    <div class="scroll" id="rv-scroll">
      <div class="docwrap" id="docwrap">
        <div class="doc" id="doc" aria-label="Photo of your document. Outlined words are ones I'm unsure about."></div>
        <div class="docbar"><span>Your photo · tap a word to check it</span><button id="docsize" aria-expanded="false">Expand</button></div>
      </div>
      <div class="legend" aria-label="Legend">
        <span><svg width="22" height="8" viewBox="0 0 22 8" aria-hidden="true"><path d="M1 4q2.5-4 5 0t5 0 5 0 5 0" fill="none" stroke="#b4462f" stroke-width="2"/></svg>Not sure</span><span><i class="sw med"></i>Fairly sure</span><span><i class="sw ok"></i>You reviewed</span>
      </div>
      <div class="tabs" id="tabs" role="tablist" hidden>
        <button role="tab" aria-selected="true" data-tab="orig" id="tab-orig">German (original)</button>
        <button role="tab" aria-selected="false" data-tab="tr">English translation</button>
      </div>
      <div class="trnote" id="trnote" hidden>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        <span id="trnote-t"></span>
      </div>
      <div class="tx" id="tx"></div>
    </div>
    <div class="bottombar">
      <button class="btn primary" id="nextbtn"></button>
    </div>
  </section>

  <!-- FINISH -->
  <section class="screen" id="s-fin" aria-label="Finished transcription">
    <div class="topbar">
      <button class="iconbtn" id="fin-back" aria-label="Back to review"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="t"><b>Transcription ready</b></div>
    </div>
    <div class="scroll"><div class="fin" id="fin"></div></div>
  </section>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="grab" aria-hidden="true"></div>
    <div class="sh-head"><h3 id="sh-title"></h3><button class="iconbtn" id="sh-close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sh-body" id="sh-body"></div>
    <div class="sh-foot" id="sh-foot"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ---------- Sample data (simulated AI output) ---------- */
const DOCS = {
  letter:{
    title:"Letter to Margaret", lang:"English", font:"letter", translate:false,
    lines:[
      "Dear Margaret,",
      "Thank you for the lovely [quilt]. It",
      "arrived on Tuesday and [harold] says",
      "it is the finest he has seen. The",
      "weather here has been [bitter], so it",
      "came at just the right time. Little",
      "[ellen] started school last week and",
      "already reads better than her brother.",
      "Please give my love to Aunt [ruth]",
      "and tell her the recipe for the apple",
      "cake is on its way.",
      "With all my love,",
      "[josephine]"
    ],
    paras:[0,1,11],
    steps:["Finding lines of text","Reading the handwriting","Flagging words I'm unsure about"],
    unc:{
      quilt:{ink:"quilt",why:"The first letter's loop could be a “q” or a “g”, and the last letter could be a “t” or an “l”.",
        alts:[{t:"quilt",p:.72},{t:"guilt",p:.18},{t:"quill",p:.10}]},
      harold:{ink:"Howard",why:"The middle letters are cramped together. Names can't be checked against a dictionary, so you may know better than I do.",
        alts:[{t:"Harold",p:.55},{t:"Howard",p:.31},{t:"Harald",p:.14}]},
      bitter:{ink:"bitter",why:"The first vowel is a single short stroke. It could be an i, e, or u.",
        alts:[{t:"bitter",p:.58},{t:"better",p:.30},{t:"butter",p:.12}]},
      ellen:{ink:"Ellen",why:"The end of this word trails off at the edge of the line.",
        alts:[{t:"Ellen",p:.64},{t:"Ellie",p:.22},{t:"Allen",p:.14}]},
      ruth:{ink:"Ruth",why:"The ink is faded here.",
        alts:[{t:"Ruth",p:.57},{t:"Rita",p:.26},{t:"Beth",p:.17}]},
      josephine:{ink:"Josephine",why:"The final letter has an extra flourish that could be an “a”.",
        alts:[{t:"Josephine",p:.83},{t:"Josephina",p:.17}]}
    }
  },
  record:{
    title:"Baptism record, Kirchberg", lang:"German", font:"record", translate:true,
    lines:[
      "Im Jahre 1891 am [d14] März",
      "wurde in [kirchberg] geboren",
      "Anna Maria Hoffmann, eheliche",
      "Tochter des [bauern] Johann Georg",
      "Hoffmann und seiner Ehefrau",
      "Katharina geb. [weber].",
      "[getauft] am 16. März.",
      "Pate: Maria Schäfer aus [lindenau]."
    ],
    paras:[0,6,7],
    steps:["Finding lines of text","Reading the handwriting","Detected German · translating to English","Flagging words I'm unsure about"],
    trTemplate:"In the year 1891, on the {d14} of March, Anna Maria Hoffmann was born in {kirchberg}, legitimate daughter of the {bauern} Johann Georg Hoffmann and his wife Katharina, née {weber}.\n{getauft} on 16 March.\nGodparent: Maria Schäfer from {lindenau}.",
    unc:{
      d14:{ink:"14.",why:"The second digit's stroke could be a 4, a 1, or a 7. Dates matter for family records, so check the photo.",
        alts:[{t:"14.",p:.62,tr:"14th",ctx:"…on the <b>14th</b> of March, 1891"},{t:"11.",p:.27,tr:"11th",ctx:"…on the <b>11th</b> of March, 1891"},{t:"17.",p:.11,tr:"17th",ctx:"…on the <b>17th</b> of March, 1891"}]},
      kirchberg:{ink:"Kirchberg",why:"The letters after “Kir” are faint. Place names can't be checked against a dictionary.",
        alts:[{t:"Kirchberg",p:.58,tr:"Kirchberg",ctx:"…was born in <b>Kirchberg</b> (a town; means “church hill”)"},{t:"Kirschberg",p:.30,tr:"Kirschberg",ctx:"…was born in <b>Kirschberg</b> (a town; means “cherry hill”)"},{t:"Kirchborg",p:.12,tr:"Kirchborg",ctx:"…was born in <b>Kirchborg</b> (no known town by this name)"}]},
      bauern:{ink:"Brauers",why:"There may be an “r” after the B. This word is the father's job, so each option changes the meaning.",
        alts:[{t:"Bauern",p:.52,tr:"farmer",ctx:"…daughter of the <b>farmer</b> Johann Georg Hoffmann"},{t:"Brauers",p:.34,tr:"brewer",ctx:"…daughter of the <b>brewer</b> Johann Georg Hoffmann"},{t:"Bäckers",p:.14,tr:"baker",ctx:"…daughter of the <b>baker</b> Johann Georg Hoffmann"}]},
      weber:{ink:"Weber",why:"The middle letter might be an “h”. This is a surname.",
        alts:[{t:"Weber",p:.81,tr:"Weber",ctx:"…his wife Katharina, née <b>Weber</b> (surname; also means “weaver”)"},{t:"Wehner",p:.19,tr:"Wehner",ctx:"…his wife Katharina, née <b>Wehner</b> (surname)"}]},
      getauft:{ink:"Getauft",why:"In this handwriting, “au” and “ra” look almost the same, and the two words mean very different things.",
        alts:[{t:"Getauft",p:.66,tr:"Baptized",ctx:"<b>Baptized</b> on 16 March."},{t:"Getraut",p:.34,tr:"Married",ctx:"<b>Married</b> on 16 March."}]},
      lindenau:{ink:"Lindenau",why:"The ending is smudged.",
        alts:[{t:"Lindenau",p:.74,tr:"Lindenau",ctx:"…from <b>Lindenau</b> (a town)"},{t:"Lindenhof",p:.26,tr:"Lindenhof",ctx:"…from <b>Lindenhof</b> (a farm or estate name)"}]}
    }
  }
};

/* ---------- State ---------- */
let doc=null, key=null, tokens=[], order=[], state={}, edits={}, tab="orig", sheetId=null, sel=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(id){ $$(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }

/* parse lines into tokens */
function parse(d){
  const out=[];
  d.lines.forEach((line,li)=>{
    line.split(" ").forEach((tok,wi)=>{
      const m=tok.match(/^([^\[]*)\[(\w+)\](.*)$/);
      if(m) out.push({line:li,id:m[2],pre:m[1],suf:m[3],unc:true});
      else out.push({line:li,id:`w${li}_${wi}`,text:tok,unc:false});
    });
  });
  return out;
}
const level=id=>doc.unc[id].alts[0].p<0.6?"low":"med";
const curText=id=>state[id].text;
function wordText(t){ return t.unc ? t.pre+curText(t.id)+t.suf : (edits[t.id]??t.text); }
function trFor(id){
  const s=state[id], a=doc.unc[id].alts.find(a=>a.t===s.text);
  return a?a.tr:`[${s.text}]`;
}
const pending=()=>order.filter(id=>!state[id].done);

/* ---------- Home ---------- */
$$("[data-doc]").forEach(b=>b.onclick=()=>start(b.dataset.doc));
$$("[data-pick]").forEach(b=>b.onclick=()=>openPicker());
$("#langchip").onclick=()=>toast("Language settings aren't part of this prototype");

function openPicker(){
  openSheet("Choose a document",
   `<div class="pick"><p>In this prototype, the camera and upload are simulated. Pick a sample document to continue.</p>
    <button class="sample" data-p="letter"><div><b>Letter to Margaret</b><small>English cursive · 1958</small></div></button>
    <button class="sample" data-p="record"><div><b>Baptism record, Kirchberg</b><small>German · 1891</small></div></button></div>`,"");
  $$("[data-p]").forEach(b=>b.onclick=()=>{closeSheet();start(b.dataset.p);});
}

/* ---------- Processing ---------- */
function start(k){
  key=k; doc=DOCS[k]; tokens=parse(doc); order=tokens.filter(t=>t.unc).map(t=>t.id);
  state={}; edits={}; tab="orig";
  order.forEach(id=>state[id]={text:doc.unc[id].alts[0].t,done:false,how:null});
  const sb=$("#scanbox");
  sb.innerHTML=`<div class="scanline"></div>`+doc.lines.slice(0,9).map(l=>`<div style="font-family:${doc.font==='letter'?"'Cedarville Cursive'":"'Pinyon Script'"},cursive;white-space:nowrap">${esc(l.replace(/\[(\w+)\]/g,(_,id)=>doc.unc[id].ink))}</div>`).join("");
  $("#proc-title").textContent="Reading your document…";
  const ul=$("#steps"); ul.innerHTML=doc.steps.map(s=>`<li><span class="dot"></span>${s}</li>`).join("");
  show("s-proc");
  const lis=[...ul.children]; let i=0;
  const tick=()=>{
    if(i>0){lis[i-1].className="done";lis[i-1].querySelector(".dot").textContent="✓";}
    if(i<lis.length){lis[i].className="doing";i++;setTimeout(tick,850);}
    else{
      $("#proc-title").textContent=`Done. ${order.length} words need a second look.`;
      setTimeout(openReview,1000);
    }
  };
  tick();
}

/* ---------- Review ---------- */
function openReview(){
  $("#rv-title").textContent=doc.title;
  $("#doc").className="doc f-"+doc.font;
  $("#tabs").hidden=!doc.translate;
  $("#trnote").hidden=!doc.translate;
  renderDoc(); renderTx(); updateProgress();
  show("s-review");
}
function renderDoc(){
  const byLine={};
  tokens.forEach(t=>(byLine[t.line]??=[]).push(t));
  $("#doc").innerHTML=Object.values(byLine).map(ts=>`<div class="hl">`+ts.map(t=>{
    if(t.unc) return `${esc(t.pre)}<span class="dw unc ${level(t.id)} ${state[t.id].done?'done':''}" data-id="${t.id}">${esc(doc.unc[t.id].ink)}</span>${esc(t.suf)}`;
    return `<span class="dw" data-id="${t.id}">${esc(t.text)}</span>`;
  }).join(" ")+`</div>`).join("");
  $$("#doc .dw").forEach(s=>s.onclick=()=>openWord(s.dataset.id));
}
function cls(id){ const s=state[id]; return "w unc "+(s.done?"done":level(id)); }
function aria(id){ const s=state[id]; return `${s.text}. ${s.done?"Reviewed":(level(id)==="low"?"Not sure":"Fairly sure")}. Tap to review.`; }
function renderTx(){
  const tx=$("#tx");
  if(doc.translate && tab==="tr"){
    $("#trnote-t").textContent="Highlighted words come from spots you haven't reviewed yet. Tap one to compare the German options and their meanings.";
    const parts=doc.trTemplate.split("\n").map(p=>esc(p).replace(/\{(\w+)\}/g,(_,id)=>`<button class="${cls(id)}" data-id="${id}" aria-label="${esc(aria(id))}">${esc(trFor(id))}</button>`));
    tx.innerHTML=parts.map(p=>`<p>${p}</p>`).join("");
  } else {
    if(doc.translate) $("#trnote-t").textContent="This document is in German. When you check a word, you'll see each German option with its English meaning.";
    let html="", cur=-1;
    tokens.forEach(t=>{
      if(t.line!==cur){
        if(cur>=0) html+= doc.paras.includes(t.line)?"</p><p>":" ";
        cur=t.line;
      } else html+=" ";
      if(t.unc) html+=`${esc(t.pre)}<button class="${cls(t.id)}" data-id="${t.id}" aria-label="${esc(aria(t.id))}">${esc(curText(t.id))}</button>${esc(t.suf)}`;
      else html+=`<button class="w ${edits[t.id]!=null?'edited':''}" tabindex="-1" data-id="${t.id}">${esc(wordText(t))}</button>`;
    });
    tx.innerHTML="<p>"+html+"</p>";
  }
  $$("#tx .w").forEach(b=>b.onclick=()=>openWord(b.dataset.id));
}
function updateProgress(){
  const n=order.length, d=n-pending().length;
  $("#rv-prog").textContent=`${d} of ${n} uncertain words reviewed`;
  $("#rv-bar").style.width=(d/n*100)+"%";
  const nb=$("#nextbtn"), p=pending().length;
  if(p){ nb.innerHTML=`Review next word <span style="opacity:.75;font-weight:500">(${p} left)</span>`; nb.onclick=()=>openWord(pending()[0]); }
  else { nb.innerHTML=`Finish transcription`; nb.onclick=finish; }
}
$$("#tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; $$("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b)); renderTx();
});
$("#back").onclick=()=>show("s-home");
$("#docsize").onclick=e=>{const w=$("#docwrap");const big=w.classList.toggle("big");e.target.textContent=big?"Shrink":"Expand";e.target.setAttribute("aria-expanded",big);};

/* link transcription <-> document */
function flash(id){
  $$("#doc .dw.flash").forEach(x=>x.classList.remove("flash"));
  $$(".w.active").forEach(x=>x.classList.remove("active"));
  const s=$(`#doc .dw[data-id="${id}"]`);
  if(s){ s.classList.add("flash"); const d=$("#doc"); d.scrollTo({top:s.offsetTop-d.clientHeight/2+20,left:Math.max(0,s.offsetLeft-60),behavior:"smooth"}); $("#rv-scroll").scrollTo({top:0,behavior:"smooth"}); }
  $$(`#tx .w[data-id="${id}"]`).forEach(x=>x.classList.add("active"));
}

/* ---------- Sheet ---------- */
function openSheet(title,body,foot){
  $("#sh-title").innerHTML=title; $("#sh-body").innerHTML=body; $("#sh-foot").innerHTML=foot;
  $("#sh-foot").style.display=foot?"flex":"none";
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  setTimeout(()=>($("#sheet [aria-checked=true]")||$("#sh-close")).focus(),320);
}
function closeSheet(){
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); sheetId=null;
  $$("#doc .dw.flash").forEach(x=>x.classList.remove("flash")); $$(".w.active").forEach(x=>x.classList.remove("active"));
}
$("#scrim").onclick=closeSheet; $("#sh-close").onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#sheet").classList.contains("on")) closeSheet(); });

function zoomHTML(id){
  const i=tokens.findIndex(t=>t.id===id), t=tokens[i];
  const ink=t2=>t2? (t2.unc? t2.pre+doc.unc[t2.id].ink+t2.suf : t2.text):"";
  const prev=tokens[i-1]&&tokens[i-1].line===t.line?ink(tokens[i-1]):"";
  const next=tokens[i+1]&&tokens[i+1].line===t.line?ink(tokens[i+1]):"";
  const mid=t.unc? `${esc(t.pre)}<span class="z">${esc(doc.unc[id].ink)}</span>${esc(t.suf)}` : `<span class="z">${esc(t.text)}</span>`;
  return `<div class="zoom f-${doc.font}" aria-hidden="true"><span class="ctx">${esc(prev)}</span> ${mid} <span class="ctx">${esc(next)}</span></div><p class="zcap">Zoomed in from your photo, line ${t.line+1}</p>`;
}

function openWord(id){
  sheetId=id; flash(id);
  const t=tokens.find(t=>t.id===id);
  if(!t.unc) return openEdit(t);
  const u=doc.unc[id], s=state[id], n=order.indexOf(id)+1;
  const isOwn=!u.alts.some(a=>a.t===s.text);
  sel = isOwn? "__own" : s.text;
  const lv=level(id);
  const title=`${s.done?"Reviewed word":(lv==="low"?"I'm not sure about this word":"I'm fairly sure, but check")}<small>Word ${n} of ${order.length}${doc.translate?" · options in German with English meaning":""}</small>`;
  const opts=u.alts.map((a,i)=>`
    <button class="opt" role="radio" aria-checked="${sel===a.t}" data-v="${esc(a.t)}">
      <div class="row"><span class="radio"></span><span class="word" lang="${doc.translate?'de':'en'}">${esc(a.t.replace(/\.$/,""))}</span>${i===0?'<span class="badge best">AI\'s best guess</span>':''}</div>
      <div class="conf"><span class="bar"><i style="width:${a.p*100}%"></i></span>${Math.round(a.p*100)}% likely</div>
      ${doc.translate?`<div class="tr"><span class="lbl">In English</span>${a.ctx}</div>`:""}
    </button>`).join("");
  const own=`<button class="opt own" role="radio" aria-checked="${isOwn}" data-v="__own">
      <div class="row"><span class="radio"></span><span class="word">None of these, I'll type it</span></div>
      <div class="own-in"><input id="ownin" aria-label="Type the correct word" placeholder="Type what it says" value="${isOwn?esc(s.text):""}"></div>
    </button>`;
  const body=`${zoomHTML(id)}
    <div class="why"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><div><b>Why I'm unsure:</b> ${u.why}</div></div>
    <div class="opts" role="radiogroup" aria-label="Possible readings">${opts}${own}</div>`;
  const foot=`<button class="btn ghost" id="skip">${pending().filter(x=>x!==id).length?"Skip for now":"Cancel"}</button><button class="btn primary" id="confirm">Confirm</button>`;
  openSheet(title,body,foot);
  $$(".opt").forEach(o=>o.onclick=e=>{
    if(e.target.tagName==="INPUT") return;
    sel=o.dataset.v; $$(".opt").forEach(x=>x.setAttribute("aria-checked",x===o));
    if(sel==="__own") setTimeout(()=>$("#ownin").focus(),0);
    validate();
  });
  $("#ownin").oninput=validate;
  $("#ownin").onkeydown=e=>{ if(e.key==="Enter"&&!$("#confirm").disabled) $("#confirm").click(); if(e.key===" ") e.stopPropagation(); };
  $("#skip").onclick=()=>{ const nx=nextAfter(id); nx?openWord(nx):closeSheet(); };
  $("#confirm").onclick=()=>confirmWord(id);
  validate();
}
function nextAfter(id){ const p=pending().filter(x=>x!==id); const i=order.indexOf(id); return p.find(x=>order.indexOf(x)>i)||p[0]; }
function validate(){ $("#confirm").disabled = sel==="__own" && !$("#ownin").value.trim(); }

function confirmWord(id){
  const u=doc.unc[id], s=state[id];
  const val= sel==="__own" ? $("#ownin").value.trim() : sel;
  s.text=val; s.done=true;
  s.how = sel==="__own" ? "typed" : (val===u.alts[0].t ? "kept" : "changed");
  renderDoc(); renderTx(); updateProgress();
  const nx=nextAfter(id);
  toast(`Saved “${val.replace(/\.$/,"")}”`);
  if(nx) setTimeout(()=>openWord(nx),250);
  else { closeSheet(); setTimeout(()=>toast("All words reviewed. Tap Finish when ready."),400); }
}

function openEdit(t){
  const cur=edits[t.id]??t.text;
  openSheet(`Edit this word<small>I was confident here, but you can still fix it</small>`,
    `${zoomHTML(t.id)}<label class="sr" for="editin">Word</label><input class="edit-in" id="editin" value="${esc(cur)}">`,
    `<button class="btn ghost" id="ecancel">Cancel</button><button class="btn primary" id="esave">Save</button>`);
  setTimeout(()=>$("#editin").select(),330);
  $("#ecancel").onclick=closeSheet;
  const save=()=>{ const v=$("#editin").value.trim(); if(!v) return; if(v!==t.text) edits[t.id]=v; else delete edits[t.id]; closeSheet(); renderTx(); toast("Word updated"); };
  $("#esave").onclick=save; $("#editin").onkeydown=e=>{if(e.key==="Enter")save();};
}

/* ---------- Finish ---------- */
function plain(){
  let out="", cur=-1;
  tokens.forEach(t=>{ if(t.line!==cur){ if(cur>=0) out+= doc.paras.includes(t.line)?"\n\n":"\n"; cur=t.line;} else out+=" "; out+=wordText(t); });
  return out;
}
function plainTr(){ return doc.trTemplate.replace(/\{(\w+)\}/g,(_,id)=>trFor(id)); }
function finish(){
  const c={kept:0,changed:0,typed:0}; order.forEach(id=>c[state[id].how]++);
  const ne=Object.keys(edits).length;
  $("#fin").innerHTML=`
    <div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <h2>Nice work</h2>
    <p class="sub">You checked every word I was unsure about.</p>
    <div class="stats">
      <div><b>${c.kept}</b><small>AI guesses you confirmed</small></div>
      <div><b>${c.changed}</b><small>Times you picked another option</small></div>
      <div><b>${c.typed+ne}</b><small>Words you typed or fixed</small></div>
    </div>
    <div class="card"><div class="hd"><b>${doc.lang} transcription</b><button data-copy="t">Copy</button></div><p lang="${doc.translate?'de':'en'}">${esc(plain())}</p></div>
    ${doc.translate?`<div class="card"><div class="hd"><b>English translation</b><button data-copy="tr">Copy</button></div><p>${esc(plainTr())}</p></div>`:""}
    <button class="btn soft" id="again" style="margin-bottom:10px">Keep editing</button>
    <button class="btn ghost" id="newdoc">Start a new document</button>`;
  $$("[data-copy]").forEach(b=>b.onclick=async()=>{
    const txt=b.dataset.copy==="t"?plain():plainTr();
    try{ await navigator.clipboard.writeText(txt); toast("Copied"); }catch(e){ toast("Couldn't copy. Select the text instead."); }
  });
  $("#again").onclick=()=>show("s-review"); $("#fin-back").onclick=()=>show("s-review");
  $("#newdoc").onclick=()=>show("s-home");
  show("s-fin");
}
</script>
</body>
</html>
